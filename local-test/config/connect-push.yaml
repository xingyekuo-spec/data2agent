templates: templates
landing: local-test/data/middle-meta.sqlite
sources:
  digiwin_e10:
    adapter: sqlite_readonly
    path: local-test/data/source.sqlite
    tables:
      CUSTOMER:
        mode: incremental
        watermark: LAST_MODIFIED_DATE
      CURRENCY:
        mode: full_refresh
      ITEM:
        mode: incremental
        watermark: LAST_MODIFIED_DATE
      ITEM_WAREHOUSE:
        mode: full_refresh
      QUOTATION:
        mode: incremental
        watermark: LAST_MODIFIED_DATE
      SALES_ORDER:
        mode: incremental
        watermark: LAST_MODIFIED_DATE
      SALES_ORDER_D:
        mode: incremental
        watermark: LAST_MODIFIED_DATE
    windows: []
    rate:
      batch_size: 5000
      rows_per_second: 2000
    lookback: 3d
    sync_every: 30m
    apply_after_sync: false   # 推送模式:映射在平台侧跑
    sink:
      type: http
      url: "http://127.0.0.1:8850"
      allow_insecure_http: true   # 本机参考链例外;生产必须 https
