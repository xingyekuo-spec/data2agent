      item_code: D2A_PURCHASE_OVERBUY_EVIDENCE.item_code
      supplier_id: D2A_PURCHASE_OVERBUY_EVIDENCE.supplier_id
      po_date: D2A_PURCHASE_OVERBUY_EVIDENCE.po_date
      demand_qty: D2A_PURCHASE_OVERBUY_EVIDENCE.demand_qty
