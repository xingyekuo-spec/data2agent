      moq: D2A_PURCHASE_OVERBUY_EVIDENCE.moq
      actual_excess_qty: D2A_PURCHASE_OVERBUY_EVIDENCE.actual_excess_qty
      planned_moq_excess_qty: D2A_PURCHASE_OVERBUY_EVIDENCE.planned_moq_excess_qty
      moq_forced_excess_qty: D2A_PURCHASE_OVERBUY_EVIDENCE.moq_forced_excess_qty
      manual_excess_qty: D2A_PURCHASE_OVERBUY_EVIDENCE.manual_excess_qty
      inventory_qty: D2A_PURCHASE_OVERBUY_EVIDENCE.inventory_qty
      trace_type: D2A_PURCHASE_OVERBUY_EVIDENCE.trace_type
      calculation_status: D2A_PURCHASE_OVERBUY_EVIDENCE.calculation_status
      related_department: D2A_PURCHASE_OVERBUY_EVIDENCE.related_department
