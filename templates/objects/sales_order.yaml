object: SalesOrder
display_name: 销售订单
description: 外销订单;接单评审链的历史弹药(成交价与实际结果)
domain: 销售
source_of_truth: 鼎捷 ERP 订单单头 / 单身
keys: [order_no]
properties:
  - { name: order_no, type: string, desc: 订单号 }
  - { name: customer, type: ref, ref: Customer, desc: 客户 }
  - { name: order_date, type: date, desc: 订单日期 }
  - { name: currency, type: string, desc: 币别 }
  - { name: total_amount, type: money, desc: 订单总额 }
  - { name: trade_term, type: string, desc: 贸易条款(FOB / EXW 等) }
  - { name: promised_ship_date, type: date, desc: 承诺船期 / 交期 }
states: [已接单, 生产中, 部分出货, 完全出货, 已结案, 已作废]
relations:
  - { name: lines, target: SalesOrderLine, cardinality: "1..n", desc: 订单明细 }
actions:
  - { name: delivery_risk_review, desc: 交期风险评估并生成建议卡, tier: 说 }
bindings:
  - source: digiwin_yifei
    tables: [COPTC, COPTD]
    status: draft
    watermark: 待核对(单据修改 / 审核日期)
  - source: digiwin_e10
    tables: [SALES_ORDER, CURRENCY]
    status: draft
    key_map: { order_no: SALES_ORDER.DOC_NO }
    field_map:
      order_no: SALES_ORDER.DOC_NO
      customer: CUSTOMER.CUSTOMER_CODE (join SALES_ORDER.CUSTOMER_ID)
      order_date: SALES_ORDER.DOC_DATE
      currency: CURRENCY.CURRENCY_CODE (join SALES_ORDER.CURRENCY_ID)
      total_amount: SALES_ORDER.TOTAL_AMOUNT
      trade_term: SALES_ORDER.TRADE_TERM
      promised_ship_date: SALES_ORDER.PROMISED_SHIP_DATE
    watermark: SALES_ORDER.LAST_MODIFIED_DATE
    notes: >-
      展厅模拟表形;业务状态由 APPROVE_DATE / CLOSE_STATE / INVALID_STATE 推导
      (Y 作废→已作废;未审核→草稿不映射;N→已接单;P→部分出货;F→完全出货;C→已结案;
      已接单与生产中的区分需关联工单,首批对象未覆盖,暂合并为已接单)
knowledge_refs: [出口贸易条款口径, 船期与钓季档期常识]
