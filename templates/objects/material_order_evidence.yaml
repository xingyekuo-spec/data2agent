object: MaterialOrderEvidence
display_name: 订单取消/减量证据
description: 按品号、销售订单和采购行预计算的订单取消/减量与备料关系
domain: 销售
source_of_truth: 数据平台呆滞库存 R1 预计算结果（来源：鼎捷 E10 销售订单与采购需求来源）
keys: [plant_id, item_code, sales_order_no, po_no, po_line_no]
properties:
  - { name: plant_id, type: string, desc: 工厂编码 }
  - { name: item_code, type: string, desc: 品号编码 }
  - { name: sales_order_no, type: string, desc: 销售订单号 }
  - { name: po_no, type: string, desc: 采购单号 }
  - { name: po_line_no, type: string, desc: 采购单行号 }
  - { name: order_date, type: date, desc: 销售订单日期 }
  - { name: demand_event_date, type: date, desc: 取消或减量事件日期 }
  - { name: demand_event_type, type: enum, enum_values: [已取消, 已减量], desc: 需求事件类型 }
  - { name: demand_qty, type: decimal, desc: 有效需求量 }
  - { name: planned_qty, type: decimal, desc: 计划发货量 }
  - { name: shipped_qty, type: decimal, desc: 已出货量 }
  - { name: cancelled_or_reduced_qty, type: decimal, desc: 已取消或减少数量 }
  - { name: purchase_qty, type: decimal, desc: 对应采购数量 }
  - { name: purchase_date, type: date, desc: 采购日期 }
  - { name: trace_type, type: enum, enum_values: [indirect], desc: 库存到订单的追溯方式 }
  - { name: calculation_status, type: enum, enum_values: [ready, unknown], desc: 计算状态 }
  - { name: related_department, type: string, desc: 关联销售部门，不等同于责任认定 }
  - { name: related_employee, type: string, desc: 关联销售经办人，不等同于责任认定, sensitive: true }
  - { name: warnings, type: text, desc: 结构化警示 JSON }
  - { name: as_of_date, type: date, desc: 数据快照日 }
  - { name: calculation_version, type: string, desc: 计算版本 }
