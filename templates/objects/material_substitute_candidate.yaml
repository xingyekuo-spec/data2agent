object: MaterialSubstituteCandidate
display_name: 物料转用候选
description: 基于当前 BOM 与未结案工单识别的呆滞库存可消耗候选
domain: 供应
source_of_truth: 数据平台基于 MaterialBomUsage 的预计算结果
keys: [source_plant_id, item_code, target_plant_id, candidate_parent_item_code, candidate_type]
properties:
  - { name: source_plant_id, type: string, desc: 库存来源工厂 }
  - { name: item_code, type: string, desc: 呆滞品号编码 }
  - { name: target_plant_id, type: string, desc: 潜在消耗工厂 }
  - { name: candidate_parent_item_code, type: string, desc: 潜在消耗主件品号 }
  - { name: candidate_type, type: enum, enum_values: [bom_consumption], desc: 候选类型 }
  - { name: basis, type: enum, enum_values: [active_bom_open_mo], desc: 候选依据 }
  - { name: potential_consume_qty, type: decimal, desc: 预计可消耗数量 }
  - { name: open_mo_count, type: int, desc: 未结案工单数量 }
  - { name: open_mo_plan_qty, type: decimal, desc: 未结案工单计划产量 }
  - { name: constraint_note, type: text, desc: 转用约束说明 }
  - { name: trace_type, type: enum, enum_values: [indirect], desc: 库存到候选的追溯方式 }
  - { name: calculation_status, type: enum, enum_values: [candidate], desc: 计算状态 }
  - { name: warnings, type: text, desc: 结构化警示 JSON }
  - { name: as_of_date, type: date, desc: 数据快照日 }
  - { name: calculation_version, type: string, desc: 计算版本 }
bindings:
  - source: digiwin_e10
    tables: [D2A_MATERIAL_SUBSTITUTE_CANDIDATE, D2A_MATERIAL_BOM_USAGE, D2A_DEAD_STOCK_ITEM, ITEM, BOM_D, MO]
    materializer: dead_stock_attribution_v3
    status: draft
    key_map:
