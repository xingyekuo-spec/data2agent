object: MaterialBomUsage
display_name: 物料 BOM 使用
description: 呆滞物料在当前 BOM 中的主件使用关系及未结案工单需求
domain: 供应
source_of_truth: 数据平台基于 BOM_D 与 MO 的预计算结果
keys: [plant_id, item_code, parent_item_code]
properties:
  - { name: plant_id, type: string, desc: 工厂编码 }
  - { name: item_code, type: string, desc: 呆滞品号编码 }
  - { name: parent_item_code, type: string, desc: 使用该物料的主件品号 }
  - { name: parent_item_name, type: string, desc: 主件品名 }
  - { name: qty_per, type: decimal, desc: BOM 组成用量 }
  - { name: denominator, type: decimal, desc: BOM 底数 }
  - { name: restriction_text, type: text, desc: BOM 使用限制说明 }
  - { name: open_mo_count, type: int, desc: 未结案工单数量 }
  - { name: open_mo_plan_qty, type: decimal, desc: 未结案工单计划产量 }
  - { name: potential_required_qty, type: decimal, desc: 按 BOM 估算的潜在需求数量 }
  - { name: trace_type, type: enum, enum_values: [indirect], desc: 库存到 BOM/工单的追溯方式 }
  - { name: calculation_status, type: enum, enum_values: [ready, no_open_demand], desc: 计算状态 }
  - { name: warnings, type: text, desc: 结构化警示 JSON }
  - { name: as_of_date, type: date, desc: 数据快照日 }
  - { name: calculation_version, type: string, desc: 计算版本 }
relations:
  - { name: substitute_candidates, target: MaterialSubstituteCandidate, cardinality: "0..n", desc: 可消耗/转用候选 }
bindings:
  - source: digiwin_e10
    tables: [D2A_MATERIAL_BOM_USAGE, D2A_DEAD_STOCK_ITEM, ITEM, BOM_D, MO]
    materializer: dead_stock_attribution_v3
    status: draft
    key_map:
      plant_id: D2A_MATERIAL_BOM_USAGE.plant_id
      item_code: D2A_MATERIAL_BOM_USAGE.item_code
      parent_item_code: D2A_MATERIAL_BOM_USAGE.parent_item_code
    field_map:
      plant_id: D2A_MATERIAL_BOM_USAGE.plant_id
      item_code: D2A_MATERIAL_BOM_USAGE.item_code
      parent_item_code: D2A_MATERIAL_BOM_USAGE.parent_item_code
      parent_item_name: D2A_MATERIAL_BOM_USAGE.parent_item_name
      qty_per: D2A_MATERIAL_BOM_USAGE.qty_per
      denominator: D2A_MATERIAL_BOM_USAGE.denominator
      restriction_text: D2A_MATERIAL_BOM_USAGE.restriction_text
      open_mo_count: D2A_MATERIAL_BOM_USAGE.open_mo_count
      open_mo_plan_qty: D2A_MATERIAL_BOM_USAGE.open_mo_plan_qty
      potential_required_qty: D2A_MATERIAL_BOM_USAGE.potential_required_qty
      trace_type: D2A_MATERIAL_BOM_USAGE.trace_type
      calculation_status: D2A_MATERIAL_BOM_USAGE.calculation_status
      warnings: D2A_MATERIAL_BOM_USAGE.warnings
      as_of_date: D2A_MATERIAL_BOM_USAGE.as_of_date
      calculation_version: D2A_MATERIAL_BOM_USAGE.calculation_version
    notes: M3c 使用关系证据；未结案工单需求用于后续消耗建议，不直接形成根因。
