[project]
name = "data2agent"
version = "0.5.13"
description = "Data to Agent, for factories — 把工厂数据接给 AI Agent:抽取框架 + 国产 ERP 连接器 + 制造业本体模板 + MCP Server"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
connect = ["pyodbc>=5.1", "apscheduler>=3.10"]
postgres = ["psycopg[binary]>=3.1"]            # 落地库改用 PostgreSQL 时(后续切片,当前 SQLite 不需要)
mcp = ["mcp>=1.0"]
console = ["fastapi>=0.110", "uvicorn>=0.29"]
middle_admin = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.0"]
ingest = ["fastapi>=0.110", "uvicorn>=0.29"]   # 平台侧接收端(Pattern A)
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "pytest-xdist>=3.6", "httpx2>=2.9"]

[project.urls]
Homepage = "https://github.com/xingyekuo-spec/data2agent"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data2agent*"]

[tool.setuptools.package-data]
data2agent = [
  "admin_templates/*.html",
  "admin_templates/static/*.js",
  "middle_admin/templates/*.html",
  "middle_admin/static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
  "unit: isolated unit or component tests",
  "contract: API, schema, or compatibility contract tests",
  "integration: tests that require an external service",
  "slow: tests that are intentionally excluded from the fastest feedback loop",
]
