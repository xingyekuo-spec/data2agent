[project]
name = "data2agent"
version = "0.6.5"
description = "Data to Agent, for factories — 工厂 ERP 只读抽取中间机:水位增量 / 对账 / 推送到任意数据平台(通用 Webhook、ingest v3、AI Hub)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
connect = ["pyodbc>=5.1", "apscheduler>=3.10"]
middle_admin = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.0"]
dev = ["pytest>=8.0", "pytest-xdist>=3.6", "httpx2>=2.9"]

[project.urls]
Homepage = "https://github.com/xingyekuo-spec/data2agent"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data2agent*"]

[tool.setuptools.package-data]
data2agent = [
  "shared/admin_templates/*.html",
  "shared/admin_templates/*.md",
  "shared/admin_templates/static/*.js",
  "middle/admin/templates/*.html",
  "middle/admin/static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
  "unit: isolated unit or component tests",
  "contract: API, schema, or compatibility contract tests",
  "integration: tests that require an external service",
  "slow: tests that are intentionally excluded from the fastest feedback loop",
]
