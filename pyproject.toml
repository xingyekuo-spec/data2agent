[project]
name = "data2agent"
version = "0.1.5"
description = "Data to Agent, for factories — 把工厂数据接给 AI Agent:抽取框架 + 国产 ERP 连接器 + 制造业本体模板 + MCP Server"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
connect = ["pyodbc>=5.1", "apscheduler>=3.10"]
postgres = ["psycopg[binary]>=3.1"]            # 落地库改用 PostgreSQL 时(后续切片,当前 SQLite 不需要)
mcp = ["mcp>=1.0"]
console = ["fastapi>=0.110", "uvicorn>=0.29"]
ingest = ["fastapi>=0.110", "uvicorn>=0.29"]   # 平台侧接收端(Pattern A)
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/xingyekuo-spec/data2agent"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data2agent*"]
