# E10-like 参考链:docker compose up --build
# 拓扑(docs/design/04):mssql(参考源)→ seed(灌数+建只读账号)
#   → connector(serve 常驻:sync+apply+每日对账)→ /data 卷
#   → mcp(HTTP :8848)+ console(运维控制台 :8849)
# 冒烟:docker compose exec connector \
#         python -m data2agent.showroom.review_demo --db /data/factory.sqlite
# Apple silicon 依赖 Rosetta 仿真;arm64 原生备选:
#   MSSQL_IMAGE=mcr.microsoft.com/azure-sql-edge MSSQL_PLATFORM=linux/arm64
services:
  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    platform: ${MSSQL_PLATFORM:-linux/amd64}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "D2a!Showroom1"

  seed:
    build: { context: ., dockerfile: deploy/runner.Dockerfile }
    depends_on: [mssql]
    environment:
      D2A_IT_MSSQL_SA_DSN: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=mssql,1433;UID=sa;PWD=D2a!Showroom1;TrustServerCertificate=yes"
    command: python -m data2agent.showroom.seed_mssql

  connector:
    build: { context: ., dockerfile: deploy/runner.Dockerfile }
    depends_on:
      seed: { condition: service_completed_successfully }
    environment:
      # 抽取走只读账号,不碰 sa —— 与真实工厂部署同一姿势
      D2A_E10_DSN: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=mssql,1433;UID=d2a_reader;PWD=D2a!Reader1;DATABASE=d2a_e10;TrustServerCertificate=yes"
    volumes: [d2a-data:/data]
    command: python -m data2agent.connect serve --config deploy/showroom-connect.yaml

  mcp:
    build: { context: ., dockerfile: deploy/runner.Dockerfile }
    depends_on: [connector]
    volumes: [d2a-data:/data]
    ports: ["8848:8848"]
    command:
      - bash
      - -lc
      # --allow-anonymous 仅限本地参考链;内网部署删掉它并设置 D2A_MCP_TOKEN
      - >-
        until [ -f /data/factory.sqlite ]; do echo '等待首轮抽取…'; sleep 3; done;
        exec python -m data2agent.mcp_server --db /data/factory.sqlite
        --transport http --host 0.0.0.0 --port 8848 --allow-anonymous

  console:
    build: { context: ., dockerfile: deploy/runner.Dockerfile }
    depends_on: [connector]
    environment:
      D2A_E10_DSN: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=mssql,1433;UID=d2a_reader;PWD=D2a!Reader1;DATABASE=d2a_e10;TrustServerCertificate=yes"
      # 本地参考链不启用认证;真实部署请设置 D2A_CONSOLE_TOKEN
    volumes: [d2a-data:/data]
    ports: ["8849:8849"]
    command:
      - bash
      - -lc
      - >-
        until [ -f /data/factory.sqlite ]; do sleep 3; done;
        exec python -m data2agent.console --config deploy/showroom-connect.yaml
        --host 0.0.0.0 --port 8849

volumes:
  d2a-data:
