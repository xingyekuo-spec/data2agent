name: ci
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: read

# 同一分支的新提交会取消旧流水线，避免修复迭代排队。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'data2agent/**'
              - 'tests/**'
              - 'scripts/**/*.py'
              - 'deploy/ingest_protocol_compat.json'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,middle_admin,connect]"
      - run: python scripts/verify.py module backend
      - name: ingest 协议兼容门禁
        run: |
          # 相对 PR 基线 / 推送前 commit / main 比对,禁止静默缩短 field_baseline
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "null" ]; then
            BASE_REF="${{ github.event.before }}"
          fi
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "null" ] || \
             [ "$(echo "$BASE_REF" | tr -d '0')" = "" ]; then
            BASE_REF="origin/main"
            git fetch --no-tags origin main 2>/dev/null || true
          fi
          python scripts/check_ingest_compat.py --base-ref "$BASE_REF"
          python -m pytest tests/contract/test_ingest_protocol_compat.py -q --tb=short

  # MSSQL 适配器集成测试依赖真实容器；tag 发布与手动触发必须跑通。
  mssql-integration:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker compose -f tests/integration/mssql/docker-compose.yml up
          --build --abort-on-container-exit --exit-code-from runner

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
