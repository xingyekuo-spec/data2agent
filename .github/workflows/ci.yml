name: ci
on: [push, pull_request, workflow_dispatch]

# gitleaks-action 在 pull_request 上会调 GitHub API 列 PR commits,
# 默认 GITHUB_TOKEN 无 pull-requests:read 时会 403 Resource not accessible。
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks 需要完整历史
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev,mcp,console,ingest,excel,middle_admin,connect]"
      - run: pytest tests -q
      - run: python scripts/export_console_openapi.py --check console-ui/openapi.json
      - run: python scripts/smoke_admin_ui.py
      - run: python -m data2agent.metamodel.validate templates
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Vue Console(console-ui):契约类型 → lint → typecheck → test → build,
  # 全程不依赖已启动的后端或外网 API(npm ci 之后)。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console-ui/package-lock.json
      - run: npm ci
      - run: npm run api:check      # openapi.json 与生成类型漂移即失败
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build          # 生产构建(默认 REAL,base=/v1/)
      - run: node scripts/check-dist.mjs   # 产物 base/CDN/MSW 分包检查
      # e2e 浏览器验收(Real 部分需要 Python 后端 + Playwright 浏览器)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev,console,connect]"
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # M6:完整多阶段 runner 镜像含 Vue dist,并验证容器内 /v1
  # 默认仅手动/推送到主分支触发(构建含 ODBC,较重);也可 workflow_dispatch。
  docker-v1:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runner image and verify /v1
        run: python scripts/check_docker_v1_distribution.py --image data2agent:m6
      - name: Upload evidence log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-v1-evidence
          path: |
            # script prints evidence.json to stdout; also keep Dockerfile for audit
            deploy/runner.Dockerfile
          if-no-files-found: ignore

  # M6:完整多阶段 runner 镜像含 Vue dist,并验证容器内 /v1
  # 默认仅手动或推送到主分支触发(构建含 ODBC,较重)。
  docker-v1:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runner image and verify /v1
        run: >
          python scripts/check_docker_v1_distribution.py
          --image data2agent:m6
          --evidence-out docker-v1-evidence.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-v1-evidence
          path: docker-v1-evidence.json
          if-no-files-found: ignore

  # MSSQL 适配器集成测试(重:手动触发)
  mssql-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker compose -f tests/integration/mssql/docker-compose.yml up
          --build --abort-on-container-exit --exit-code-from runner
