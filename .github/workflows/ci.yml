name: ci
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: read

# 同一分支的新提交会取消旧流水线，避免修复迭代排队。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      distribution: ${{ steps.filter.outputs.distribution }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'data2agent/**'
              - 'tests/**'
              - 'templates/**'
              - 'scripts/**/*.py'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'console-ui/**'
              - 'data2agent/console/**'
              - 'scripts/export_console_openapi.py'
              - '.github/workflows/ci.yml'
            e2e:
              - 'data2agent/**'
              - 'console-ui/**'
              - 'templates/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            distribution:
              - 'deploy/**'
              - 'console-ui/vite.config.ts'
              - 'console-ui/package.json'
              - 'console-ui/package-lock.json'
              - 'scripts/check_docker_v1_distribution.py'
              - 'scripts/check_v1_distribution.py'
              - 'docker-compose.yml'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,mcp,console,ingest,excel,middle_admin,connect]"
      - run: python scripts/verify.py module backend

  frontend:
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console-ui/package-lock.json
      - run: npm ci --prefer-offline
      - run: npm run api:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node scripts/check-dist.mjs

  e2e-mock:
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console-ui/package-lock.json
      - run: npm ci --prefer-offline
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('console-ui/package-lock.json') }}
      - run: npx playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: node scripts/e2e-acceptance.mjs --mock

  e2e-real:
    needs: changes
    if: >
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request' ||
       startsWith(github.ref, 'refs/tags/') ||
       github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master') &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/') ||
       github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console-ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: npm ci --prefer-offline
      - run: pip install -e ".[dev,console,connect]"
        working-directory: .
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('console-ui/package-lock.json') }}
      - run: npx playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: node scripts/e2e-acceptance.mjs --real
        env:
          D2A_PYTHON: python

  # 完整 runner 镜像较重，仅分发链路变化或手动触发时运行。
  docker-distribution:
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.distribution == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runner image and verify UI distribution
        run: >
          python scripts/check_docker_v1_distribution.py
          --image data2agent:ci
          --evidence-out docker-distribution-evidence.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-distribution-evidence
          path: docker-distribution-evidence.json
          if-no-files-found: ignore

  # MSSQL 适配器集成测试依赖真实容器，保留为手动/发布级验证。
  mssql-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker compose -f tests/integration/mssql/docker-compose.yml up
          --build --abort-on-container-exit --exit-code-from runner

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
