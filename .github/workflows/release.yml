name: release
# 打 tag(v*)或手动触发 → 测试通过后,打出两台 Windows 机各自的离线运行包,上传 GitHub Release。
# 工厂内网无需访问 GitHub:在一台联网机下载 Release 附件,U 盘 / 内网共享拷到两台即可离线安装。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "打包的分支或 tag(手动触发时用;默认当前分支)"
        required: false
        default: ""

permissions:
  contents: write        # 创建 Release、上传附件需要

env:
  PY_VERSION: "3.12"     # 与 CI 和生产机一致
  WIN_PLATFORM: "win_amd64"

jobs:
  # 打包前先跑测试,坏版本不发布
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - run: pip install -e ".[dev,mcp,console,ingest,excel]"
      - run: pytest tests -q
      - run: python -m data2agent.metamodel.validate templates

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build            # 产出 dist/*.whl 与 dist/*.tar.gz

      # 组装运行包骨架:代码 + 模板 + 配置样例(不含 tests/docs/deploy)
      - name: 组装运行包骨架
        run: |
          set -eux
          stage=stage
          mkdir -p "$stage"
          cp -r data2agent templates pyproject.toml README.md connect.example.yaml "$stage"/

      # 离线依赖:下 Windows 平台 wheel(生产机为 Windows,不能用默认 Linux wheel)
      - name: 下载 Windows 离线依赖(中间机 / connect)
        run: |
          set -eux
          python -m pip download \
            --dest stage/wheels \
            --platform ${{ env.WIN_PLATFORM }} \
            --python-version ${{ env.PY_VERSION }} \
            --implementation cp \
            --only-binary=:all: \
            "pydantic>=2.7" "pyyaml>=6.0" \
            "pyodbc>=5.1" "apscheduler>=3.10"
          # 注:connect 组含 psycopg[binary],生产 SQLite 落地不需要,故此处不打入以精简体积。

      - name: 打中间机运行包
        run: |
          set -eux
          cp -r stage d2a-runtime-connect-${{ steps.ver.outputs.version }}
          cd d2a-runtime-connect-${{ steps.ver.outputs.version }}
          # 安装说明随包附带
          cat > INSTALL-connect.txt <<'EOF'
          中间服务器离线安装(Windows PowerShell,Python 3.12 已装):
            python -m venv C:\d2a\venv
            C:\d2a\venv\Scripts\pip install --no-index --find-links=wheels -e .[connect]
          另需装 ODBC Driver 18 for SQL Server(连 E10)。
          完整步骤见仓库 docs/runbook/windows-deploy.md。
          EOF
          cd ..
          zip -rq d2a-runtime-connect-${{ steps.ver.outputs.version }}.zip \
            d2a-runtime-connect-${{ steps.ver.outputs.version }}

      - name: 下载 Windows 离线依赖(平台机 / 全套接收端)
        run: |
          set -eux
          rm -rf stage/wheels && mkdir -p stage/wheels
          python -m pip download \
            --dest stage/wheels \
            --platform ${{ env.WIN_PLATFORM }} \
            --python-version ${{ env.PY_VERSION }} \
            --implementation cp \
            --only-binary=:all: \
            "pydantic>=2.7" "pyyaml>=6.0" \
            "pyodbc>=5.1" "apscheduler>=3.10" \
            "mcp>=1.0" "fastapi>=0.110" "uvicorn>=0.29"

      - name: 打平台机运行包
        run: |
          set -eux
          cp -r stage d2a-runtime-platform-${{ steps.ver.outputs.version }}
          cd d2a-runtime-platform-${{ steps.ver.outputs.version }}
          cat > INSTALL-platform.txt <<'EOF'
          数据平台离线安装(Windows PowerShell,Python 3.12 已装):
            python -m venv C:\d2a\venv
            C:\d2a\venv\Scripts\pip install --no-index --find-links=wheels -e .[ingest,connect,mcp,console]
          平台机不连 ERP,无需 ODBC 驱动。
          完整步骤见仓库 docs/runbook/windows-deploy.md。
          EOF
          cd ..
          zip -rq d2a-runtime-platform-${{ steps.ver.outputs.version }}.zip \
            d2a-runtime-platform-${{ steps.ver.outputs.version }}

      # 手动触发也能拿到产物(不创建 Release)
      - name: 上传构建产物(workflow_dispatch)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: d2a-runtime-${{ steps.ver.outputs.version }}
          path: |
            d2a-runtime-connect-${{ steps.ver.outputs.version }}.zip
            d2a-runtime-platform-${{ steps.ver.outputs.version }}.zip
            dist

      # 打 tag 时创建 Release 并附上运行包(私有仓库:仅有权限者可下载)
      - name: 创建 Release 并上传附件(tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            d2a-runtime-connect-${{ steps.ver.outputs.version }}.zip
            d2a-runtime-platform-${{ steps.ver.outputs.version }}.zip
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          body: |
            ## data2agent ${{ steps.ver.outputs.version }} 离线运行包

            工厂内网离线部署(两台 Windows):在联网机下载附件,拷到目标机离线安装。

            | 附件 | 用途 | 安装 extras |
            | --- | --- | --- |
            | `d2a-runtime-connect-*.zip` | 中间服务器(抽取 + 推送) | `.[connect]` |
            | `d2a-runtime-platform-*.zip` | 数据平台(接收 + apply + MCP + 控制台) | `.[ingest,connect,mcp,console]` |

            每个 zip 内含 `data2agent/` + `templates/` + 配置样例 + Windows(py3.12/win_amd64)离线依赖 wheel + `INSTALL-*.txt`。
            完整部署步骤见 `docs/runbook/windows-deploy.md`。
