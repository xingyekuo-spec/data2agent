name: release
# 打 tag(v*)或手动触发 → 测试通过后,打出两台 Windows 便携包(解压即用),上传 GitHub Release。
# 每个便携包只有一个入口:data2agent.exe
# 平台/中间机应用版本可独立升级;仅 ingest 协议不兼容时才须升级中间机。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "打包的分支或 tag(手动触发时用;默认当前分支)"
        required: false
        default: ""
      py_version:
        description: "目标 Python 版本(须与 embeddable / wheel 一致)"
        required: false
        default: "3.14"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_VERSION: ${{ github.event.inputs.py_version || '3.14' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,mcp,console,ingest,excel,middle_admin,connect]"
      - run: python scripts/verify.py module backend
      - name: ingest 协议兼容门禁 + 旧中间机契约
        run: |
          python scripts/check_ingest_compat.py
          python -m pytest tests/test_ingest_protocol_compat.py -q --tb=short

  # M6 Release 门槛:真实 SQL Server 元数据 / 业务键 / 快照替换必须在打包前通过。
  # module backend 使用 not integration，不能替代本 job。
  mssql-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: MSSQL compose integration
        run: >
          docker compose -f tests/integration/mssql/docker-compose.yml up
          --build --abort-on-container-exit --exit-code-from runner

  package:
    needs: [test, mssql-integration]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console-ui/package-lock.json

      - name: 构建 Vue Console
        working-directory: console-ui
        run: |
          npm ci
          npm run build
          node scripts/check-dist.mjs

      - name: 解析版本号
        id: ver
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            "version=$env:GITHUB_REF_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            $sha = git rev-parse --short HEAD
            "version=manual-$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: 构建 wheel + 启动器 exe
        run: |
          python -m pip install --upgrade pip build
          python -m build
          .\deploy\build_ui_launchers.ps1 -OutDir dist/launchers

      - name: 下载依赖并组装中间机便携包
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $py = python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}')"
          New-Item -ItemType Directory -Force -Path stage/wheels-middle | Out-Null
          python -m pip download --dest stage/wheels-middle --only-binary=:all: `
            "setuptools>=68" "wheel" `
            "pydantic>=2.7" "pyyaml>=6.0" `
            "pyodbc>=5.1" "apscheduler>=3.10" `
            "fastapi>=0.110" "uvicorn>=0.29" "jinja2>=3.0" "markupsafe"
          .\deploy\build_portable.ps1 -Role middle -Version $v `
            -OutDir dist/portable -WheelsDir stage/wheels-middle -PyFullVersion $py `
            -LauncherExe dist/launchers/middle/data2agent.exe
          Copy-Item "dist/portable/d2a-portable-middle-$v.zip" .

      - name: 下载依赖并组装平台机便携包
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $py = python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}')"
          New-Item -ItemType Directory -Force -Path stage/wheels-platform | Out-Null
          python -m pip download --dest stage/wheels-platform --only-binary=:all: `
            "setuptools>=68" "wheel" `
            "pydantic>=2.7" "pyyaml>=6.0" `
            "pyodbc>=5.1" "apscheduler>=3.10" `
            "mcp>=1.0" "fastapi>=0.110" "uvicorn>=0.29"
          .\deploy\build_portable.ps1 -Role platform -Version $v `
            -OutDir dist/portable -WheelsDir stage/wheels-platform -PyFullVersion $py `
            -LauncherExe dist/launchers/platform/data2agent.exe
          Copy-Item "dist/portable/d2a-portable-platform-$v.zip" .

      - name: 上传构建产物(workflow_dispatch)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: d2a-portable-${{ steps.ver.outputs.version }}
          path: |
            d2a-portable-middle-${{ steps.ver.outputs.version }}.zip
            d2a-portable-platform-${{ steps.ver.outputs.version }}.zip

      - name: 生成 Release 正文(含协议兼容性)
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          python -m pip install -e ".[ingest]"
          {
            echo "## data2agent ${{ steps.ver.outputs.version }} 便携包"
            echo ""
            echo "解压 → 双击 **\`data2agent.exe\`**(唯一入口)。"
            echo ""
            echo "| 附件 | 用途 |"
            echo "| --- | --- |"
            echo "| \`d2a-portable-middle-*.zip\` | 中间服务器 |"
            echo "| \`d2a-portable-platform-*.zip\` | 数据平台 |"
            echo ""
            echo "首次打开浏览器完成配置;之后同一次双击会拉起后台服务。"
            echo "中间机另需 **ODBC Driver 18** MSI。详见 \`docs/runbook/portable.md\`。"
            echo ""
            RELEASE_VERSION="${{ steps.ver.outputs.version }}" \
              python scripts/check_ingest_compat.py --emit-release-notes \
              --release-version "${{ steps.ver.outputs.version }}"
          } > release-body.md

      - name: 创建 Release 并上传附件(tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            d2a-portable-middle-${{ steps.ver.outputs.version }}.zip
            d2a-portable-platform-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
          body_path: release-body.md
