{% extends "layout.html" %}
{% block title %}日志 — 运维控制台{% endblock %}
{% block content %}
<style>
  .card{background:#fff;border-radius:10px;padding:18px 20px;margin-bottom:16px;
        box-shadow:0 1px 3px rgba(16,34,54,.08)}
  .card h2{font-size:15px;margin:0 0 12px;color:#12314f}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .toolbar label{font-size:13px;color:#51606f}
  .toolbar select,.toolbar input{padding:6px 8px;border:1px solid #d0d7de;border-radius:6px;font-size:13px}
  .toolbar input[type=number]{width:80px}
  pre.log-view{background:#0f1720;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto;
              font-size:12px;line-height:1.45;max-height:70vh;white-space:pre-wrap;margin:0}
</style>

<div class="card">
  <h2>服务日志</h2>
  <div class="toolbar">
    <label>服务
      <select id="log-service">
        <option value="ingest">ingest(接收)</option>
        <option value="apply">apply(物化)</option>
        <option value="mcp">mcp(网关)</option>
        <option value="console" selected>console(管理界面)</option>
        <option value="launcher">launcher(启动器/重启)</option>
      </select>
    </label>
    <label>行数 <input type="number" id="log-lines" value="200" min="1" max="1000"></label>
    <label>级别过滤 <input type="text" id="log-level" placeholder="ERROR"></label>
    <button type="button" id="log-refresh">刷新</button>
  </div>
  <pre id="log-output" class="log-view">加载中…</pre>
</div>

<script>
(function () {
  var output = document.getElementById('log-output');

  function authHeaders() {
    var h = {};
    var token = sessionStorage.getItem('d2a_token');
    if (token) h['Authorization'] = 'Bearer ' + token;
    return h;
  }

  function loadLogs() {
    var service = document.getElementById('log-service').value;
    var lines = document.getElementById('log-lines').value || '200';
    var level = document.getElementById('log-level').value.trim();
    var url = '/api/logs?service=' + encodeURIComponent(service) +
              '&lines=' + encodeURIComponent(lines);
    if (level) url += '&level=' + encodeURIComponent(level);
    fetch(url, {headers: authHeaders()})
      .then(function (r) { return r.json(); })
      .then(function (body) {
        output.textContent = body.ok ? (body.text || '(空)') : (body.text || '读取失败');
      })
      .catch(function () { output.textContent = '请求失败'; });
  }

  document.getElementById('log-refresh').addEventListener('click', loadLogs);
  document.getElementById('log-service').addEventListener('change', loadLogs);
  loadLogs();
})();
</script>
{% endblock %}
