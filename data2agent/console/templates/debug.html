{% extends "layout.html" %}
{% block title %}调试 — 运维控制台{% endblock %}
{% block content %}
<style>
  .card{background:#fff;border-radius:10px;padding:18px 20px;margin-bottom:16px;
        box-shadow:0 1px 3px rgba(16,34,54,.08)}
  .card h2{font-size:15px;margin:0 0 12px;color:#12314f}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .toolbar label{font-size:13px;color:#51606f}
  .toolbar input,.toolbar select,.toolbar textarea{padding:6px 8px;border:1px solid #d0d7de;
    border-radius:6px;font-size:13px}
  .toolbar input[type=number]{width:70px}
  .toolbar textarea{width:100%;max-width:520px;min-height:80px;font-family:monospace}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
  th,td{text-align:left;padding:4px 6px;border-bottom:1px solid #e8edf2;vertical-align:top}
  th{color:#51606f;font-weight:600}
  pre.result{background:#0f1720;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto;
             font-size:12px;max-height:320px;white-space:pre-wrap}
  .meta{font-size:13px;color:#51606f}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
  .badge-ok{background:#e6f4ea;color:#1e7e34}
  .badge-off{background:#fdecea;color:#b42318}
</style>

<div class="card">
  <h2>ingest 健康检查</h2>
  <div id="ingest-health" class="meta">加载中…</div>
</div>

<div class="card">
  <h2>raw 表浏览器(只读)</h2>
  <div class="toolbar">
    <label>表名 <input type="text" id="raw-table" placeholder="raw_digiwin_e10_QUOTATION"></label>
    <label>offset <input type="number" id="raw-offset" value="0" min="0"></label>
    <label>limit <input type="number" id="raw-limit" value="50" min="1" max="200"></label>
    <button type="button" id="raw-load">查询</button>
  </div>
  <p id="raw-meta" class="meta"></p>
  <div id="raw-results"></div>
</div>

<div class="card">
  <h2>MCP 工具试调用(白名单)</h2>
  <div class="toolbar" style="flex-direction:column;align-items:flex-start">
    <label>工具
      <select id="mcp-tool">
        <option value="query_objects">query_objects</option>
        <option value="query_metrics">query_metrics</option>
      </select>
    </label>
    <label style="width:100%">参数 JSON
      <textarea id="mcp-params">{}</textarea>
    </label>
    <button type="button" id="mcp-call">调用</button>
  </div>
  <pre id="mcp-result" class="result">(尚无结果)</pre>
</div>

<script>
(function () {
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function authHeaders(extra) {
    var h = {'Content-Type': 'application/json'};
    var token = sessionStorage.getItem('d2a_token');
    if (token) h['Authorization'] = 'Bearer ' + token;
    if (extra) Object.assign(h, extra);
    return h;
  }

  function loadIngestHealth() {
    fetch('/api/services', {headers: authHeaders()})
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var ing = data.ingest || {};
        document.getElementById('ingest-health').innerHTML =
          '<span class="badge ' + (ing.ok ? 'badge-ok' : 'badge-off') + '">' +
          (ing.ok ? '正常' : '异常') + '</span> · 探测方式: ' + esc(ing.method || '—') +
          ' · 端点: http://127.0.0.1:8850/ingest/health';
      })
      .catch(function () {
        document.getElementById('ingest-health').textContent = '无法获取服务状态';
      });
  }

  function renderRawTable(data) {
    document.getElementById('raw-meta').textContent =
      '表 ' + data.table + ' · 共 ' + data.total + ' 行 · offset ' + data.offset;
    var rows = data.rows || [];
    if (!rows.length) {
      document.getElementById('raw-results').innerHTML = '<p class="meta">(空)</p>';
      return;
    }
    var cols = Object.keys(rows[0]);
    var html = '<table><thead><tr>' + cols.map(function (c) {
      return '<th>' + esc(c) + '</th>';
    }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (row) {
      html += '<tr>' + cols.map(function (c) {
        return '<td>' + esc(row[c]) + '</td>';
      }).join('') + '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById('raw-results').innerHTML = html;
  }

  document.getElementById('raw-load').addEventListener('click', function () {
    var table = document.getElementById('raw-table').value.trim();
    var offset = document.getElementById('raw-offset').value || '0';
    var limit = document.getElementById('raw-limit').value || '50';
    var url = '/api/debug/raw-table?table=' + encodeURIComponent(table) +
              '&offset=' + encodeURIComponent(offset) +
              '&limit=' + encodeURIComponent(limit);
    fetch(url, {headers: authHeaders()})
      .then(function (r) { return r.json().then(function (b) { return {ok: r.ok, b: b}; }); })
      .then(function (res) {
        if (!res.ok) {
          document.getElementById('raw-meta').textContent = res.b.detail || '查询失败';
          document.getElementById('raw-results').innerHTML = '';
          return;
        }
        renderRawTable(res.b);
      });
  });

  document.getElementById('mcp-call').addEventListener('click', function () {
    var tool = document.getElementById('mcp-tool').value;
    var paramsText = document.getElementById('mcp-params').value.trim() || '{}';
    var params;
    try {
      params = JSON.parse(paramsText);
    } catch (e) {
      document.getElementById('mcp-result').textContent = '参数 JSON 无效: ' + e.message;
      return;
    }
    fetch('/api/debug/mcp-call', {
      method: 'POST', headers: authHeaders(), body: JSON.stringify({tool: tool, params: params})
    }).then(function (r) { return r.json().then(function (b) { return {ok: r.ok, b: b}; }); })
      .then(function (res) {
        document.getElementById('mcp-result').textContent = res.ok
          ? JSON.stringify(res.b, null, 2)
          : (res.b.detail || JSON.stringify(res.b, null, 2));
      })
      .catch(function (e) {
        document.getElementById('mcp-result').textContent = '请求失败: ' + e.message;
      });
  });

  loadIngestHealth();
})();
</script>
{% endblock %}
