{% extends "layout.html" %}
{% block title %}对账 — 中间机管理{% endblock %}
{% block content %}
<section class="card" aria-labelledby="reconcile-actions-title">
  <p class="layer">对账</p><h2 id="reconcile-actions-title">执行对账</h2>
  <p class="hint">L1 对账按分段行数/水位快速核对,发现不一致段落;深度对账重读全表并执行修复
  (软删平台多余行),耗时长,建议低峰执行。对账按已配置抽取计划全表执行。</p>
  <div class="actions">
    <label class="meta" for="reconcile-source">数据源</label>
    <select id="reconcile-source" aria-label="对账数据源"></select>
    <button type="button" id="btn-reconcile">L1 对账</button>
    <button type="button" id="btn-reconcile-deep" class="btn-ghost">深度对账</button>
    <span id="action-result" class="meta" aria-live="polite"></span>
  </div>
</section>

<section class="card" aria-labelledby="reconcile-history-title">
  <div class="src-head"><h2 id="reconcile-history-title">对账历史</h2>
    <button type="button" id="reconcile-refresh" class="btn-ghost">刷新</button></div>
  <p class="hint">仅显示对账运行;同步运行见「运行」页。点「详情」页内查看逐表步骤。</p>
  <div id="reconcile-list" aria-live="polite"><p class="meta">加载中…</p></div>
</section>

<div id="run-detail-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="run-detail-title" hidden>
  <div class="modal-card">
    <div class="modal-header"><h2 id="run-detail-title">对账详情</h2><button type="button" id="run-detail-close" class="modal-close" aria-label="关闭">&times;</button></div>
    <div id="run-detail-body" aria-live="polite"></div>
  </div>
</div>
<script src="{{ static_url }}/middle-reconcile.js?v={{ static_ver }}" defer></script>
{% endblock %}
