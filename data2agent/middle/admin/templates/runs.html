{% extends "layout.html" %}
{% block title %}运行 — 中间机管理{% endblock %}
{% block page_actions %}
<label class="sr-only" for="reconcile-source">手动操作数据源</label>
<select id="reconcile-source" aria-label="手动操作数据源"></select>
<button type="button" id="btn-sync">立即同步</button>
<button type="button" id="btn-reconcile" class="btn-ghost">L1 对账</button>
<button type="button" id="btn-reconcile-deep" class="btn-danger">深度对账…</button>
{% endblock %}
{% block content %}
<p id="action-result" class="meta" aria-live="polite" hidden></p>
<section class="card">
  <h2 class="sr-only">运行历史</h2>
  <div class="toolbar">
    <label class="sr-only" for="source-filter">数据源</label><select id="source-filter"><option value="">全部源</option></select>
    <label class="sr-only" for="run-type-filter">类型</label><select id="run-type-filter"><option value="">全部类型</option><option value="sync">同步</option><option value="reconcile">对账</option></select>
    <span class="spacer"></span>
    <span class="meta" id="runs-refreshed" aria-live="polite"></span>
    <button type="button" id="runs-refresh" class="btn-ghost btn-sm">刷新</button>
  </div>
  <div id="runs-list" aria-live="polite"></div>
  <div class="pager">
    <span class="meta" id="page-info"></span>
    <label for="limit-select">每页</label><select id="limit-select"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option></select>
    <button type="button" id="prev-page" class="btn-ghost btn-sm">‹ 上一页</button><button type="button" id="next-page" class="btn-ghost btn-sm">下一页 ›</button>
  </div>
</section>

<div id="run-detail-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="run-detail-title" hidden>
  <div class="modal-card run-detail-card">
    <div class="rd-head">
      <div class="modal-header"><h2 id="run-detail-title">运行详情</h2><button type="button" id="run-detail-close" class="modal-close" aria-label="关闭">&times;</button></div>
      <div class="rd-sub"><span id="run-detail-status"></span><span id="run-detail-poll" class="poll-note"></span></div>
    </div>
    <div class="rd-body" id="run-detail-body" aria-live="polite"></div>
  </div>
</div>
<script src="{{ static_url }}/middle-runs.js?v={{ static_ver }}" defer></script>
<script src="{{ static_url }}/middle-actions.js?v={{ static_ver }}" defer></script>
{% endblock %}
