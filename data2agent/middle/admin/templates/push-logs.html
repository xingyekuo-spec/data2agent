{% extends "layout.html" %}
{% block title %}推送记录 — 中间机管理{% endblock %}
{% block content %}
<style>
  .push-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px}
  .push-stat{border:1px solid #e8edf2;border-radius:8px;padding:12px}
  .push-stat dt{font-size:11px;color:#6a7682;letter-spacing:.03em;text-transform:uppercase}
  .push-stat dd{font-size:20px;font-weight:600;color:#12314f;margin:4px 0 0}
  .push-rows{font-size:12px;color:#51606f}
</style>

<div class="card">
  <div class="tabs">
    <button type="button" class="tab active" id="tab-btn-by-table" onclick="switchTab('by-table')">按表概览</button>
    <button type="button" class="tab" id="tab-btn-detail" onclick="switchTab('detail')">推送明细</button>
    <span class="meta" style="margin-left:auto;align-self:center">仅 sink.type=http 时有记录</span>
  </div>

  <!-- Tab:按表概览 -->
  <div id="tab-by-table">
    <p class="hint">每张表最近批次的推送状态;点击行跳转到该表的推送明细。</p>
    <div id="by-table-list"><p class="meta">加载中…</p></div>
  </div>

  <!-- Tab:推送明细 -->
  <div id="tab-detail" hidden>
    <div class="toolbar">
      <select id="table-filter" onchange="loadPushLogs()" style="display:none">
        <option value="">全部表</option>
      </select>
      <select id="source-filter" onchange="loadPushLogs()">
        <option value="">全部源</option>
      </select>
      <select id="limit-select" onchange="loadPushLogs()">
        <option value="20">20 条</option>
        <option value="50" selected>50 条</option>
        <option value="100">100 条</option>
      </select>
      <button type="button" onclick="loadPushLogs()" style="padding:4px 12px;border:1px solid #e8edf2;border-radius:6px;background:#fff;cursor:pointer;font-size:13px">刷新</button>
      <span class="meta" id="push-total" style="margin-left:auto"></span>
    </div>
    <div id="push-logs-list"><p class="meta">加载中…</p></div>
  </div>
</div>

<!-- 批次详情弹窗 -->
<div id="push-detail-overlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closePushDetail()">
  <div class="modal-card" id="push-detail-card">
    <div class="modal-header">
      <h2 id="push-detail-title">批次详情</h2>
      <button class="modal-close" onclick="closePushDetail()">&times;</button>
    </div>
    <div id="push-detail-body"><p class="meta">加载中…</p></div>
  </div>
</div>

<script>
function switchTab(name) {
  var isTable = name === 'by-table';
  document.getElementById('tab-by-table').hidden = !isTable;
  document.getElementById('tab-detail').hidden = isTable;
  document.getElementById('tab-btn-by-table').classList.toggle('active', isTable);
  document.getElementById('tab-btn-detail').classList.toggle('active', !isTable);
}

function tableStatusBadge(t) {
  if (t.status === 'completed') return '<span class="badge badge-ok">已推送完成</span>';
  if (t.status === 'failed') return '<span class="badge badge-off">推送失败</span>';
  return '<span class="badge badge-running">推送中</span>';
}

function renderByTable(data) {
  var list = data.tables || [];
  if (!list.length) return '<p class="meta">暂无推送记录</p>';
  var html = '<table class="data"><thead><tr><th>源</th><th>表</th><th>模式</th><th>推送状态</th>' +
    '<th>已推送行数</th><th>步骤(成功/失败)</th><th>耗时</th><th>最近推送</th></tr></thead><tbody>';
  list.forEach(function (t) {
    var dur = t.duration_ms != null ? (t.duration_ms / 1000).toFixed(1) + 's' : '—';
    html += '<tr class="run-row" onclick="filterTable(\'' + esc(t.source) + '\',\'' + esc(t.table_name) + '\')">';
    html += '<td>' + esc(t.source) + '</td>';
    html += '<td><b>' + esc(t.table_name) + '</b></td>';
    html += '<td>' + esc(t.mode || '—') + '</td>';
    html += '<td>' + tableStatusBadge(t) + '</td>';
    html += '<td>' + (t.rows || 0) + '</td>';
    html += '<td>' + t.steps_ok + ' / ' + (t.steps_failed ? '<span style="color:#b42318">' + t.steps_failed + '</span>' : '0') + '</td>';
    html += '<td>' + dur + '</td>';
    html += '<td>' + fmtTime(t.last_at) + '</td></tr>';
  });
  html += '</tbody></table>';
  return html;
}

function filterTable(source, table) {
  var sel = document.getElementById('table-filter');
  sel.style.display = '';
  // 确保选项存在并选中
  var found = false;
  for (var i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === table) { found = true; break; }
  }
  if (!found) sel.innerHTML += '<option value="' + esc(table) + '">' + esc(table) + '</option>';
  sel.value = table;
  loadPushLogs();
  switchTab('detail');
  document.getElementById('tab-detail').scrollIntoView({ behavior: 'smooth' });
}

function loadByTable() {
  fetch('/api/push-logs/by-table', { headers: authHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.getElementById('by-table-list').innerHTML = renderByTable(data);
      // 表过滤器选项
      var sel = document.getElementById('table-filter');
      var current = sel.value;
      var tables = {};
      (data.tables || []).forEach(function (t) { tables[t.table_name] = true; });
      var keys = Object.keys(tables).sort();
      if (keys.length) {
        sel.style.display = '';
        sel.innerHTML = '<option value="">全部表</option>';
        keys.forEach(function (t) {
          sel.innerHTML += '<option value="' + esc(t) + '"' + (t === current ? ' selected' : '') + '>' + esc(t) + '</option>';
        });
      }
    })
    .catch(function () {
      document.getElementById('by-table-list').innerHTML = '<p class="meta">按表概览加载失败</p>';
    });
}

function renderPushLogs(data) {
  var list = data.push_logs;
  document.getElementById('push-total').textContent = '共 ' + (data.total || 0) + ' 条';
  if (!list || !list.length) return '<p class="meta">暂无推送记录（仅在 sink.type=http 时有记录）</p>';
  var html = '<table class="data"><thead><tr><th>ID</th><th>源</th><th>表</th><th>步骤</th><th>批次</th><th>行数</th><th>状态</th><th>耗时</th><th>时间</th></tr></thead><tbody>';
  list.forEach(function(p) {
    var duration = p.duration_ms != null ? (p.duration_ms / 1000).toFixed(1) + 's' : '—';
    var batchShort = (p.batch_id || '').slice(-20);
    html += '<tr class="run-row" onclick="openPushBatch(\'' + esc(p.batch_id || '') + '\')">';
    html += '<td>#' + p.id + '</td>';
    html += '<td>' + esc(p.source) + '</td>';
    html += '<td>' + esc(p.table_name) + '</td>';
    html += '<td>' + esc(p.step_kind) + '</td>';
    html += '<td style="font-family:monospace;font-size:11px;max-width:120px;overflow:hidden;text-overflow:ellipsis">' + esc(batchShort) + '</td>';
    html += '<td>' + (p.rows_count != null ? p.rows_count : '—') + '</td>';
    html += '<td>' + badge(p.status) + '</td>';
    html += '<td>' + duration + '</td>';
    html += '<td>' + fmtTime(p.created_at) + '</td></tr>';
    if (p.status === 'failed' && p.error_detail) {
      html += '<tr><td></td><td colspan="8" style="color:#b42318;font-size:12px">' + esc(p.error_detail) + '</td></tr>';
    }
  });
  html += '</tbody></table>';
  return html;
}

function loadPushLogs() {
  var source = document.getElementById('source-filter').value;
  var table = document.getElementById('table-filter').value;
  var limit = document.getElementById('limit-select').value;
  var url = '/api/push-logs?limit=' + limit;
  if (source) url += '&source=' + encodeURIComponent(source);
  if (table) url += '&table=' + encodeURIComponent(table);
  fetch(url, { headers: authHeaders() })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      document.getElementById('push-logs-list').innerHTML = renderPushLogs(data);
      var sel = document.getElementById('source-filter');
      var current = sel.value;
      var sources = {};
      (data.push_logs || []).forEach(function(p) { sources[p.source] = true; });
      sel.innerHTML = '<option value="">全部源</option>';
      Object.keys(sources).sort().forEach(function(s) {
        sel.innerHTML += '<option value="' + esc(s) + '"' + (s === current ? ' selected' : '') + '>' + esc(s) + '</option>';
      });
    })
    .catch(function() {
      document.getElementById('push-logs-list').innerHTML = '<p class="meta">推送记录加载失败</p>';
    });
}

function openPushBatch(batchId) {
  if (!batchId) return;
  document.getElementById('push-detail-overlay').style.display = 'flex';
  document.getElementById('push-detail-title').textContent = '批次 ' + batchId;
  document.getElementById('push-detail-body').innerHTML = '<p class="meta">加载中…</p>';
  fetch('/api/push-logs/batch/' + encodeURIComponent(batchId), { headers: authHeaders() })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var p = data.progress;
      var completed = !!p.completed;
      var progressText = completed
        ? '已完成：成功推送 ' + p.write_ok_batches + ' 批 / ' + p.rows + ' 行'
        : '进行中：已成功推送 ' + p.write_ok_batches + ' 批 / ' + p.rows + ' 行';
      if (p.failed) progressText += '；' + p.failed + ' 个步骤失败';
      var html = '';
      html += '<dl class="push-stat-grid">';
      html += '<div class="push-stat"><dt>模式</dt><dd>' + esc(data.mode) + '</dd></div>';
      html += '<div class="push-stat"><dt>表</dt><dd>' + esc(data.table_name) + '</dd></div>';
      html += '<div class="push-stat"><dt>总步骤</dt><dd>' + p.total + '</dd></div>';
      html += '<div class="push-stat"><dt>成功</dt><dd style="color:#1e7e34">' + p.ok + '</dd></div>';
      html += '<div class="push-stat"><dt>失败</dt><dd style="color:#b42318">' + p.failed + '</dd></div>';
      html += '<div class="push-stat"><dt>推送行数</dt><dd>' + (p.rows || 0) + '</dd></div>';
      html += '<div class="push-stat"><dt>耗时</dt><dd>' + (p.duration_ms / 1000).toFixed(1) + 's</dd></div>';
      html += '</dl>';
      html += '<div style="margin-bottom:16px">';
      html += '<span class="push-rows">' + progressText + '</span>';
      // 未收到 complete_table 前无法知道总批数；不能伪造百分比。
      html += '<div class="progress-bar"><div class="progress-bar-fill" style="width:' +
              (completed ? '100' : '0') + '%"></div></div>';
      html += '</div>';
      html += '<table class="data" style="margin-top:8px"><thead><tr><th>步骤</th><th>行数</th><th>状态</th><th>耗时</th><th>时间</th></tr></thead><tbody>';
      data.steps.forEach(function(s) {
        var dur = s.duration_ms != null ? (s.duration_ms / 1000).toFixed(2) + 's' : '—';
        html += '<tr><td>' + esc(s.step_kind) + '</td>';
        html += '<td>' + (s.rows_count != null ? s.rows_count : '—') + '</td>';
        html += '<td>' + badge(s.status) + '</td>';
        html += '<td>' + dur + '</td>';
        html += '<td>' + fmtTime(s.created_at) + '</td></tr>';
        if (s.error_detail) {
          html += '<tr><td></td><td colspan="4" style="color:#b42318;font-size:12px">' + esc(s.error_detail) + '</td></tr>';
        }
      });
      html += '</tbody></table>';
      document.getElementById('push-detail-body').innerHTML = html;
    })
    .catch(function(err) {
      document.getElementById('push-detail-body').innerHTML = '<p class="meta">加载失败: ' + err.message + '</p>';
    });
}

function closePushDetail() {
  document.getElementById('push-detail-overlay').style.display = 'none';
  document.getElementById('push-detail-body').innerHTML = '';
}

loadByTable();
loadPushLogs();
</script>
{% endblock %}
