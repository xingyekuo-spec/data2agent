{% extends "layout.html" %}
{% block title %}推送记录 — 中间机管理{% endblock %}
{% block content %}
<section class="card">
  <h2 class="sr-only">推送、回执与重试</h2>
  <div class="tabs" role="tablist" aria-label="推送记录视图">
    <button type="button" class="tab active" id="push-tab-summary" role="tab" aria-selected="true" aria-controls="push-summary" tabindex="0" data-tabs="push" data-tab="push-summary">按表概览</button>
    <button type="button" class="tab" id="push-tab-detail" role="tab" aria-selected="false" aria-controls="push-detail" tabindex="-1" data-tabs="push" data-tab="push-detail">推送明细</button>
  </div>
  <section id="push-summary" class="tab-panel active" role="tabpanel" aria-labelledby="push-tab-summary" data-tabs="push">
    <div class="toolbar">
      <label class="sr-only" for="summary-source">数据源</label><select id="summary-source"><option value="">全部源</option></select>
      <label class="sr-only" for="summary-status">状态</label><select id="summary-status"><option value="">全部状态</option><option value="completed">已完成</option><option value="pushing">推送中</option><option value="failed">失败</option></select>
      <label class="sr-only" for="summary-name">表名</label><input type="search" id="summary-name" placeholder="搜索表名…">
      <span class="spacer"></span><span class="meta" id="summary-refreshed" aria-live="polite"></span>
      <button type="button" id="summary-refresh" class="btn-ghost btn-sm">刷新</button>
    </div>
    <div id="summary-list" aria-live="polite"></div>
    <div class="pager">
      <span class="meta" id="summary-page-info"></span>
      <label for="summary-limit">每页</label><select id="summary-limit"><option>10</option><option selected>20</option><option>50</option></select>
      <button type="button" id="summary-prev" class="btn-ghost btn-sm">‹ 上一页</button><button type="button" id="summary-next" class="btn-ghost btn-sm">下一页 ›</button>
    </div>
  </section>
  <section id="push-detail" class="tab-panel" role="tabpanel" aria-labelledby="push-tab-detail" data-tabs="push" hidden>
    <div class="toolbar">
      <label class="sr-only" for="detail-source">数据源</label><select id="detail-source"><option value="">全部源</option></select>
      <label class="sr-only" for="detail-table">表</label><select id="detail-table"><option value="">全部表/事件</option></select>
      <span class="spacer"></span><span class="meta" id="detail-refreshed" aria-live="polite"></span>
      <button type="button" id="detail-refresh" class="btn-ghost btn-sm">刷新</button>
    </div>
    <div id="detail-list" aria-live="polite"></div>
    <div class="pager">
      <span class="meta" id="detail-page-info"></span>
      <label for="detail-limit">每页</label><select id="detail-limit"><option>20</option><option selected>50</option><option>100</option></select>
      <button type="button" id="detail-prev" class="btn-ghost btn-sm">‹ 上一页</button><button type="button" id="detail-next" class="btn-ghost btn-sm">下一页 ›</button>
    </div>
  </section>
</section>
<div id="push-detail-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="push-detail-title" hidden>
  <div class="modal-card"><div class="modal-header"><h2 id="push-detail-title">批次详情</h2><button type="button" id="push-detail-close" class="modal-close" aria-label="关闭">&times;</button></div><div id="push-detail-body" aria-live="polite"></div></div>
</div>
<script src="{{ static_url }}/middle-push-logs.js?v={{ static_ver }}" defer></script>
{% endblock %}
