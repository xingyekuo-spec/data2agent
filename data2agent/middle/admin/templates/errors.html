{% extends "layout.html" %}
{% block title %}告警 — 中间机管理{% endblock %}
{% block page_actions %}
<span id="alerts-refreshed" class="meta" aria-live="polite"></span>
<button type="button" id="refresh-alerts" class="btn-ghost">刷新</button>
{% endblock %}
{% block content %}
<section class="card" aria-labelledby="alerts-title">
  <h2 id="alerts-title" class="sr-only">当前告警</h2>
  <div class="chips" id="category-filters" role="group" aria-label="告警分类"></div>
  <div id="alerts-list"><p class="meta">加载告警中…</p></div>
</section>

<section class="card" aria-labelledby="recovered-title">
  <details><summary id="recovered-title"><b>已恢复告警（<span id="recovered-count">0</span>）</b></summary>
    <div id="recovered-list"></div>
  </details>
</section>

<script src="{{ static_url }}/middle-errors.js?v={{ static_ver }}" defer></script>
{% endblock %}
