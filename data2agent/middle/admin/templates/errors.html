{% extends "layout.html" %}
{% block title %}错误处理 — 中间机管理{% endblock %}
{% block content %}
<style>
  .banner{background:#e8f4fd;border:1px solid #b6d9f5;color:#0b4a6f;border-radius:8px;
          padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{border:1px solid #d0d7de;border-radius:999px;padding:4px 12px;font-size:13px;
        cursor:pointer;background:#fff;color:#51606f}
  .chip.active{background:#12314f;color:#fff;border-color:#12314f}
  .alert-card{background:#fff;border-radius:10px;padding:14px 18px;margin-bottom:12px;
              box-shadow:0 1px 3px rgba(16,34,54,.08);border-left:4px solid #b42318}
  .alert-card.cat-连接失败,.alert-card.cat-网络超时{border-left-color:#d97706}
  .alert-card.cat-认证权限{border-left-color:#7c3aed}
  .alert-card.cat-数据异常{border-left-color:#b42318}
  .alert-card.cat-平台不可达{border-left-color:#1a56db}
  .alert-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .alert-head h3{font-size:14px;margin:0;color:#12314f;flex:1}
  .cat-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;
             background:#fdecea;color:#b42318}
  .cat-badge.cat-连接失败,.cat-badge.cat-网络超时{background:#fff8e6;color:#8a4b00}
  .cat-badge.cat-认证权限{background:#f3e8fd;color:#7c3aed}
  .cat-badge.cat-平台不可达{background:#e6f0fa;color:#1a56db}
  .alert-detail{font-size:13px;color:#51606f;margin:8px 0;line-height:1.6}
  .alert-detail .err-text{color:#b42318;font-size:12px}
  .alert-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .alert-actions button{font-size:12px;padding:5px 12px}
  .btn-ghost{background:#fff;color:#12314f;border:1px solid #d0d7de}
  .btn-ghost:hover{background:#f6f8fa}
  .streak{font-size:12px;color:#b42318;font-weight:600}
  .handled-note{font-size:12px;color:#1e7e34}
  details.handled{margin-top:6px}
  details.handled summary{cursor:pointer;font-size:13px;color:#51606f}
</style>

<div class="banner">
  <b>错误处理</b> — 告警来自真实运行/推送记录,按表聚合连续失败轮数并分类;
  「静默」持久化于落地库(所有访问者生效);「重试失败的表 / 立即重推」为真实动作,
  触发幂等定向同步(水位保证安全),执行后跳转运行详情跟踪进度。
</div>

<div class="card">
  <div class="chips" id="cat-chips"></div>
  <div id="alerts-list"><p class="meta">加载告警中…</p></div>
  <details class="handled" id="handled-wrap" style="display:none">
    <summary id="handled-summary">已处理(静默)</summary>
    <div id="handled-list" style="margin-top:10px"></div>
  </details>
</div>

<script>
var _alerts = [];
var _catFilter = '';
var _silences = {};  // alertKey -> silenced_until(服务端持久化)

function loadSilences() {
  return fetch('/api/alerts/silences', { headers: authHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      _silences = {};
      (data.silences || []).forEach(function (s) { _silences[s.alert_key] = s.silenced_until; });
    })
    .catch(function () { _silences = {}; });
}

// ---- 错误分类(前端启发式,验证分类规则) ----
function classify(text) {
  var t = (text || '').toLowerCase();
  if (/白名单|whitelist|权限|denied|拒绝|readonly|只读/.test(t)) return '认证权限';
  if (/超时|timeout|timed out/.test(t)) return '网络超时';
  if (/连接|connect|odbc|网络|unreachable|econn/.test(t)) return '连接失败';
  if (/推送|503|502|平台|ingest/.test(t)) return '平台不可达';
  if (/水位|运行键|null|唯一|duplicate|列不存在|结构/.test(t)) return '数据异常';
  return '其他';
}

// ---- 告警组装 ----
function alertKey(a) { return a.source + '|' + (a.table || '-') + '|' + a.category; }

function buildAlerts(runsData, failedStepsByRun, pushTables) {
  var alerts = [];
  // 1) 推送失败(按表)
  (pushTables || []).forEach(function (t) {
    if (t.status !== 'failed') return;
    alerts.push({
      kind: 'push', source: t.source, table: t.table_name,
      category: '平台不可达',
      title: '表 ' + t.table_name + ' 推送至平台失败',
      detail: '最近批次含 ' + t.steps_failed + ' 个失败步骤;水位未前进,下一轮会自动补推。',
      streak: null, last_at: t.last_at,
      actions: ['repush', 'snooze'],
    });
  });
  // 2) 运行失败(按表聚合连续轮数)
  var byTable = {};
  (runsData.runs || []).forEach(function (r) {
    if (r.status !== 'failed') return;
    var steps = failedStepsByRun[r.id] || [];
    steps.forEach(function (s) {
      var key = r.source + '|' + s.target;
      if (!byTable[key]) byTable[key] = { source: r.source, table: s.target, runs: [], error: s.error };
      byTable[key].runs.push(r.id);
      if (s.error) byTable[key].error = s.error;
    });
  });
  Object.keys(byTable).forEach(function (key) {
    var a = byTable[key];
    alerts.push({
      kind: 'extract', source: a.source, table: a.table,
      category: classify(a.error),
      title: '表 ' + a.table + ' 抽取连续失败',
      detail: null, errText: a.error,
      streak: a.runs.length,
      last_at: null,
      run_id: a.runs[0] || null,  // 最近一次含该表失败的运行(定向重试用)
      actions: ['retry-tables', 'snooze'],
    });
  });
  // 3) 源级运行失败(无表级步骤信息的整轮失败)
  (runsData.runs || []).forEach(function (r) {
    if (r.status !== 'failed') return;
    var steps = failedStepsByRun[r.id];
    if (steps && steps.length) return;  // 已有表级告警
    alerts.push({
      kind: 'run', source: r.source, table: null,
      category: classify(r.detail),
      title: '源 ' + r.source + ' 运行 #' + r.id + ' 失败',
      detail: null, errText: r.detail,
      streak: null, last_at: r.started_at,
      actions: ['retry-run', 'snooze'],
    });
  });
  return alerts;
}

// ---- 渲染 ----
var CATS = ['全部', '连接失败', '网络超时', '认证权限', '数据异常', '平台不可达', '其他'];

function renderChips() {
  var counts = {};
  _alerts.forEach(function (a) {
    if (_silences[alertKey(a)]) return;
    counts[a.category] = (counts[a.category] || 0) + 1;
  });
  var total = Object.values(counts).reduce(function (x, y) { return x + y; }, 0);
  var html = '';
  CATS.forEach(function (c) {
    var n = c === '全部' ? total : (counts[c] || 0);
    if (c !== '全部' && !n) return;
    var active = (_catFilter === c || (c === '全部' && !_catFilter)) ? ' active' : '';
    html += '<span class="chip' + active + '" onclick="setCatFilter(\'' + (c === '全部' ? '' : c) + '\')">' + c + ' ' + n + '</span>';
  });
  document.getElementById('cat-chips').innerHTML = html || '<span class="meta">无告警</span>';
}

function setCatFilter(c) { _catFilter = c; renderAll(); }

var ACTION_LABELS = {
  'retry-tables': '重试失败的表',
  'retry-run': '重试该运行',
  'repush': '立即重推',
  'snooze': '静默 24h',
};
function renderAlert(a, handled) {
  var key = alertKey(a);
  var until = _silences[key];
  var html = '<div class="alert-card cat-' + a.category + '">';
  html += '<div class="alert-head">';
  html += '<span class="cat-badge cat-' + a.category + '">' + a.category + '</span>';
  html += '<h3>' + esc(a.title) + '</h3>';
  if (a.streak && a.streak > 1) html += '<span class="streak">连续 ' + a.streak + ' 轮失败</span>';
  html += '</div>';
  html += '<div class="alert-detail">';
  html += '源 ' + esc(a.source) + (a.last_at ? ' · 最近 ' + fmtTime(a.last_at) : '');
  if (a.detail) html += '<br>' + esc(a.detail);
  if (a.errText) html += '<br><span class="err-text">' + esc(a.errText) + '</span>';
  html += '</div>';
  if (handled && until) {
    html += '<p class="handled-note">🔕 已静默至 ' + esc(until) +
            ' · <a href="javascript:void(0)" onclick="undoAction(\'' + key + '\')">撤销</a></p>';
  } else {
    html += '<div class="alert-actions">';
    a.actions.forEach(function (ac) {
      html += '<button class="btn-ghost" onclick="doAction(\'' + key + '\',\'' + ac + '\')">' +
              ACTION_LABELS[ac] + '</button>';
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderAll() {
  renderChips();
  var open = _alerts.filter(function (a) {
    if (_silences[alertKey(a)]) return false;
    return !_catFilter || a.category === _catFilter;
  });
  document.getElementById('alerts-list').innerHTML = open.length
    ? open.map(function (a) { return renderAlert(a, false); }).join('')
    : '<p class="meta">当前无未处理告警 ✅</p>';
  var handled = _alerts.filter(function (a) { return !!_silences[alertKey(a)]; });
  document.getElementById('handled-wrap').style.display = handled.length ? '' : 'none';
  document.getElementById('handled-summary').textContent = '已处理(静默)· ' + handled.length;
  document.getElementById('handled-list').innerHTML =
    handled.map(function (a) { return renderAlert(a, true); }).join('');
}

// ---- 动作 ----
function findAlert(key) {
  for (var i = 0; i < _alerts.length; i++) if (alertKey(_alerts[i]) === key) return _alerts[i];
  return null;
}

function doAction(key, action) {
  var a = findAlert(key);
  if (action === 'snooze') {
    fetch('/api/alerts/silences', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ alert_key: key, hours: 24 })
    })
      .then(function () { return loadSilences(); })
      .then(renderAll)
      .catch(function (e) { alert('静默失败: ' + e.message); });
    return;
  }
  // 真实动作:定向重试 / 立即重推(均为幂等同步,完成后跳转运行详情)
  var req;
  if (action === 'retry-tables' && a && a.run_id) {
    req = fetch('/api/runs/' + a.run_id + '/retry-failed', {
      method: 'POST', headers: authHeaders(), body: '{}'
    });
  } else if (action === 'retry-run') {
    req = fetch('/api/actions/trigger', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ action: 'sync', source: a ? a.source : null })
    });
  } else if (action === 'repush') {
    req = fetch('/api/actions/trigger', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ action: 'sync', source: a ? a.source : null,
                             tables: a && a.table ? [a.table] : null })
    });
  } else {
    return;
  }
  req.then(function (r) { return r.json(); })
    .then(function (body) {
      if (body.run_id && (body.status === 'started' || body.executed)) {
        location.href = '/runs?watch=' + body.run_id;
      } else if (body.reason === 'already_running' && body.run_id) {
        location.href = '/runs?watch=' + body.run_id;
      } else {
        alert(formatApiError(body, body.note || '触发失败'));
      }
    })
    .catch(function (e) { alert('请求失败: ' + e.message); });
}

function undoAction(key) {
  fetch('/api/alerts/silences/' + encodeURIComponent(key), {
    method: 'DELETE', headers: authHeaders()
  })
    .then(function () { return loadSilences(); })
    .then(renderAll)
    .catch(function (e) { alert('撤销失败: ' + e.message); });
}

// ---- 数据加载 ----
function loadAlerts() {
  loadSilences()
    .then(function () {
      return fetch('/api/runs?limit=50', { headers: authHeaders() });
    })
    .then(function (r) { return r.json(); })
    .then(function (runsData) {
      var failedRuns = (runsData.runs || []).filter(function (r) { return r.status === 'failed'; }).slice(0, 10);
      var stepFetches = failedRuns.map(function (r) {
        return fetch('/api/runs/' + r.id, { headers: authHeaders() })
          .then(function (x) { return x.json(); })
          .then(function (d) {
            return {
              id: r.id,
              failed: (d.steps || []).filter(function (s) { return s.status === 'failed'; }),
            };
          })
          .catch(function () { return { id: r.id, failed: [] }; });
      });
      return Promise.all(stepFetches).then(function (stepsList) {
        var byRun = {};
        stepsList.forEach(function (s) { byRun[s.id] = s.failed; });
        return { runsData: runsData, byRun: byRun };
      });
    })
    .then(function (ctx) {
      return fetch('/api/push-logs/by-table', { headers: authHeaders() })
        .then(function (r) { return r.json(); })
        .then(function (push) {
          _alerts = buildAlerts(ctx.runsData, ctx.byRun, push.tables || []);
          renderAll();
        });
    })
    .catch(function () {
      document.getElementById('alerts-list').innerHTML = '<p class="meta">告警加载失败</p>';
    });
}

loadAlerts();
</script>
{% endblock %}
