{% extends "layout.html" %}
{% block title %}日志 — 中间机管理{% endblock %}
{% block content %}
<style>
  .toolbar input[type=number]{width:80px}
  pre.log-view{background:#0f1720;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto;
              font-size:12px;line-height:1.45;max-height:70vh;white-space:pre-wrap;margin:0}
</style>

<div class="card">
  <h2>运行日志</h2>
  <p class="hint">页面报错(如连接测试失败)时,先看「管理界面」日志里的报错栈;抽取/推送问题看「连接器」日志。</p>
  <div class="toolbar">
    <label>日志
      <select id="log-service">
        <option value="connector" selected>连接器(抽取/推送)</option>
        <option value="maintenance">维护任务(状态库备份/清理)</option>
        <option value="admin">管理界面(报错栈)</option>
        <option value="launcher">启动器(重启记录)</option>
      </select>
    </label>
    <label>行数 <input type="number" id="log-lines" value="200" min="1" max="1000"></label>
    <label>级别过滤 <input type="text" id="log-level" placeholder="ERROR"></label>
    <button type="button" id="log-refresh">刷新</button>
    <label class="meta"><input type="checkbox" id="log-auto"> 自动刷新(5s)</label>
    <button type="button" id="log-copy" class="btn-ghost">复制当前日志</button>
    <span id="log-refreshed" class="meta" aria-live="polite"></span>
  </div>
  <pre id="log-output" class="log-view">加载中…</pre>
</div>

<script src="{{ static_url }}/middle-logs.js?v={{ static_ver }}" defer></script>
{% endblock %}
