{% extends "layout.html" %}
{% block title %}状态 — 中间机管理{% endblock %}
{% block content %}
<style>
  .card{background:#fff;border-radius:10px;padding:18px 20px;margin-bottom:16px;
        box-shadow:0 1px 3px rgba(16,34,54,.08)}
  .card h2{font-size:15px;margin:0 0 12px;color:#12314f}
  .layer{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#6a7682;margin:0 0 6px}
  .meta{font-size:13px;color:#51606f;line-height:1.6}
  .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
  .warn{font-size:12px;color:#8a4b00;background:#fff8e6;border:1px solid #f0d89a;
        border-radius:6px;padding:8px 10px;max-width:520px}
  .oknote{font-size:12px;color:#1e7e34;background:#e6f4ea;border:1px solid #b7dfc3;
          border-radius:6px;padding:8px 10px;max-width:520px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #e8edf2}
  th{color:#51606f;font-weight:600}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
  .badge-ok{background:#e6f4ea;color:#1e7e34}
  .badge-off{background:#fdecea;color:#b42318}
  .badge-warn{background:#fff8e6;color:#8a4b00}
</style>

<div id="status-panel"
     hx-get="/api/status"
     hx-trigger="load, every 5s"
     hx-swap="none">
  <div class="card"><p class="meta">加载状态中…</p></div>
</div>

<div class="card">
  <p class="layer">操作</p>
  <h2>连接与同步</h2>
  <div class="actions">
    <button type="button" id="btn-trigger">立即触发同步</button>
    <button type="button" id="btn-test">测试 ERP 连接</button>
    <a href="/metadata">前往元数据</a>
    <a href="/tables">前往抽取表</a>
  </div>
  <p class="warn" style="margin-top:12px">
    手动触发可能与 NSSM 计划任务重叠；响应中的 <code>overlap_warning</code> 为 true 时请确认无并发同步。
  </p>
  <div id="trigger-result" class="meta" style="margin-top:10px"></div>
  <div id="test-result" class="meta" style="margin-top:10px"></div>
</div>

<script>
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function authHeaders() {
  var h = {'Content-Type': 'application/json'};
  var token = sessionStorage.getItem('d2a_token');
  if (token) h['Authorization'] = 'Bearer ' + token;
  return h;
}
function renderStatus(data) {
  var html = '';
  (data.sources || []).forEach(function (src) {
    var inWin = src.in_window;
    var configured = !!src.tables_configured;
    html += '<div class="card">';
    html += '<p class="layer">源 ' + esc(src.source) + '</p>';

    html += '<h2>连接</h2>';
    html += '<p class="meta">DSN 由 secrets / 环境变量提供；本页不显示密码、连接串或 Token。</p>';
    html += '<p class="meta">请用「测试 ERP 连接」确认可达。连接成功但未选表时不是运行失败。</p>';

    html += '<h2 style="margin-top:16px">配置</h2>';
    if (configured) {
      html += '<p class="oknote">已配置抽取表。可在 <a href="/tables">抽取表</a> 查看与调整。</p>';
    } else {
      html += '<p class="warn">已连接，尚未配置抽取表。自动和手动同步都会跳过，不会连接 ERP。请到 <a href="/metadata">元数据</a> 选表后在 <a href="/tables">抽取表</a> 保存。</p>';
    }

    html += '<h2 style="margin-top:16px">运行</h2>';
    html += '<p class="meta">同步间隔: ' + esc(src.sync_every || '—') +
            ' · 窗口: ' + esc((src.windows || []).join(', ') || '全天') + '</p>';
    html += '<p class="meta">上次运行: ' + esc(src.last_run_at || '—') +
            ' · 下次预估: ' + esc(src.next_sync_at || '—') + '</p>';
    html += '<p><span class="badge ' + (inWin ? 'badge-ok' : 'badge-off') + '">' +
            (inWin ? '窗口内' : '窗口外') + '</span></p>';
    if (src.watermarks && src.watermarks.length) {
      html += '<table><thead><tr><th>表</th><th>水位列</th><th>高水位</th><th>上次同步</th></tr></thead><tbody>';
      src.watermarks.forEach(function (w) {
        html += '<tr><td>' + esc(w.table_name) + '</td><td>' + esc(w.watermark_col) +
                '</td><td>' + esc(w.high_water) + '</td><td>' + esc(w.last_run_at || '—') + '</td></tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<p class="meta">尚无水位记录（全量表或不曾成功增量）。</p>';
    }
    html += '</div>';
  });
  return html || '<div class="card"><p class="meta">无源配置</p></div>';
}
document.body.addEventListener('htmx:afterOnLoad', function (e) {
  if (e.detail.elt.id !== 'status-panel') return;
  try {
    var data = JSON.parse(e.detail.xhr.responseText);
    document.getElementById('status-panel').innerHTML = renderStatus(data);
  } catch (err) {
    document.getElementById('status-panel').innerHTML =
      '<div class="card"><p class="meta">状态解析失败</p></div>';
  }
});
document.getElementById('btn-trigger').onclick = async function () {
  var el = document.getElementById('trigger-result');
  el.textContent = '触发中…';
  var r = await fetch('/api/actions/trigger', {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({action: 'sync'})
  });
  var body = await r.json();
  el.textContent = JSON.stringify(body);
};
document.getElementById('btn-test').onclick = async function () {
  var el = document.getElementById('test-result');
  el.textContent = '测试中…';
  var r = await fetch('/api/connection/test', {
    method: 'POST', headers: authHeaders(), body: '{}'
  });
  var body = await r.json();
  try { sessionStorage.setItem('d2a_last_connection_test', JSON.stringify({at: Date.now(), body: body})); } catch (e) {}
  el.textContent = JSON.stringify(body);
};
</script>
{% endblock %}
