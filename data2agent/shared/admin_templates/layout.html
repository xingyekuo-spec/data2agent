<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}data2agent{% endblock %}</title>
<script src="{{ static_url }}/admin.js"></script>
<style>
  body{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
       margin:0;background:#f2f4f7;color:#1c2733}
  header{background:#12314f;color:#fff;padding:12px 22px;display:flex;
         justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  header b{font-size:16px}
  nav{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  nav a{color:#fff;text-decoration:none;font-size:13px;opacity:.9}
  nav a:hover{opacity:1;text-decoration:underline}
  nav a.active{opacity:1;font-weight:600;border-bottom:2px solid #fff;padding-bottom:2px}
  nav .nav-group{display:flex;gap:12px;align-items:center}
  nav .nav-group-label{font-size:11px;letter-spacing:.06em;opacity:.65;margin-right:-6px}
  nav .nav-divider{width:1px;height:16px;background:rgba(255,255,255,.35)}
  main{padding:16px 22px;max-width:1200px;margin:0 auto}
  /* ---- 各管理页共享的卡片/徽章/表格/弹窗样式(页面模板不再各自复制) ---- */
  .card{background:#fff;border-radius:10px;padding:18px 20px;margin-bottom:16px;
        box-shadow:0 1px 3px rgba(16,34,54,.08)}
  .card h2{font-size:15px;margin:0 0 12px;color:#12314f}
  .layer{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#6a7682;margin:0 0 6px}
  .meta{font-size:13px;color:#51606f;line-height:1.6}
  .hint{font-size:12px;color:#8a97a5;margin:0 0 12px}
  table.data{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  table.data th,table.data td{text-align:left;padding:6px 8px;border-bottom:1px solid #e8edf2}
  table.data th{color:#51606f;font-weight:600}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
  .badge-ok{background:#e6f4ea;color:#1e7e34}
  .badge-off{background:#fdecea;color:#b42318}
  .badge-warn{background:#fff8e6;color:#8a4b00}
  .badge-running{background:#e6f0fa;color:#1a56db}
  .warn{font-size:12px;color:#8a4b00;background:#fff8e6;border:1px solid #f0d89a;
        border-radius:6px;padding:8px 10px;max-width:520px}
  .oknote{font-size:12px;color:#1e7e34;background:#e6f4ea;border:1px solid #b7dfc3;
          border-radius:6px;padding:8px 10px;max-width:520px}
  .run-row{cursor:pointer}
  .run-row:hover{background:#f5f7fa}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .toolbar label{font-size:13px;color:#51606f}
  .toolbar select,.toolbar input{padding:6px 8px;border:1px solid #d0d7de;border-radius:6px;font-size:13px}
  .progress-bar{height:4px;background:#e8edf2;border-radius:2px;margin:4px 0;overflow:hidden}
  .progress-bar-fill{height:100%;background:#1a56db;border-radius:2px;transition:width .3s}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9999;
                 display:flex;align-items:center;justify-content:center}
  .modal-card{background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);
              max-width:720px;width:90vw;max-height:80vh;overflow-y:auto;padding:24px}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .modal-header h2{font-size:16px;margin:0;color:#12314f}
  .modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#6a7682;padding:0 4px}
  .modal-close:hover{color:#12314f}
  .steps-panel{display:none}
  .steps-panel.open{display:table-row}
  /* 标签页 */
  .tabs{display:flex;gap:2px;border-bottom:1px solid #e8edf2;margin-bottom:14px}
  .tab{background:none;border:0;border-bottom:2px solid transparent;color:#51606f;
       padding:8px 14px;font-size:14px;cursor:pointer;border-radius:0}
  .tab:hover{color:#12314f;background:none}
  .tab.active{color:#12314f;font-weight:600;border-bottom-color:#12314f}
  .login-panel{background:#fff;border-radius:10px;padding:24px;max-width:420px;margin:40px auto;
               box-shadow:0 1px 3px rgba(16,34,54,.08)}
  .login-panel h2{font-size:15px;margin:0 0 14px;color:#12314f}
  .login-panel label{display:block;font-size:13px;color:#51606f;margin-bottom:6px}
  .login-panel input[type=password]{width:100%;box-sizing:border-box;padding:8px 10px;
    border:1px solid #d0d7de;border-radius:6px;font-size:14px;margin-bottom:14px}
  button{background:#12314f;color:#fff;border:0;border-radius:6px;padding:8px 16px;
         cursor:pointer;font-size:13px}
  button:hover{background:#0f2840}
</style>
</head>
<body>
<header>
  <b>data2agent</b>
  <nav>{% block nav %}{% endblock %}</nav>
</header>
<main>
{% if needs_token %}
<div id="login-panel" class="login-panel" style="display:none">
  <h2>请登录管理界面</h2>
  <form id="token-form">
    <label for="d2a-token-input">管理界面登录密码</label>
    <input type="password" id="d2a-token-input" autocomplete="current-password" required>
    <button type="submit">登录</button>
  </form>
</div>
{% endif %}
<div id="page-content">
{% block content %}{% endblock %}
</div>
</main>
<script src="{{ static_url }}/htmx.min.js"></script>
<script>
document.body.addEventListener('htmx:configRequest', function (e) {
  var token = sessionStorage.getItem('d2a_token');
  if (token) {
    e.detail.headers['Authorization'] = 'Bearer ' + token;
  }
});
{% if needs_token %}
(function () {
  var token = sessionStorage.getItem('d2a_token');
  var panel = document.getElementById('login-panel');
  var content = document.getElementById('page-content');
  if (!token) {
    panel.style.display = '';
    content.style.display = 'none';
    document.getElementById('token-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var t = document.getElementById('d2a-token-input').value.trim();
      if (t) {
        sessionStorage.setItem('d2a_token', t);
        location.reload();
      }
    });
  }
})();
{% endif %}
/* 当前页导航高亮(各页在 nav 链接上标 data-nav)。 */
(function () {
  var path = location.pathname;
  document.querySelectorAll('nav a[data-nav]').forEach(function (a) {
    if (a.getAttribute('data-nav') === path) a.classList.add('active');
  });
})();
</script>
</body>
</html>
