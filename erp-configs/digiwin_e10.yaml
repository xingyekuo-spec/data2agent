# 鼎捷 E10 中间机默认抽取配置。
#
# 这是 ERP 抽取范围与同步策略的唯一默认来源，独立于 templates/ 中的
# 业务对象、字段映射和 materializer。现场只在中间机 connect.yaml 的
# sources.digiwin_e10.tables 下维护实际需要读取的表。
#
# 本文件中的呆滞库存表来自 2026-07-22 现场核对清单。该清单没有确认各表
# 可用的增量水位字段，新增项均采用 full_refresh；现场确认水位后，可直接在
# 中间机 connect.yaml 中改为 incremental + watermark，无需改业务对象模板。
tables:
  CUSTOMER:
    mode: incremental
    watermark: LAST_MODIFIED_DATE
  CURRENCY:
    mode: full_refresh
  ITEM:
    mode: incremental
    watermark: LAST_MODIFIED_DATE
  ITEM_WAREHOUSE:
    # 已核对库存和最后出入库字段；尚未核对可靠的修改时间水位，故默认全量。
    mode: full_refresh
  QUOTATION:
    mode: incremental
    watermark: LAST_MODIFIED_DATE
  SALES_ORDER:
    mode: incremental
    watermark: LAST_MODIFIED_DATE
  SALES_ORDER_D:
    mode: incremental
    watermark: LAST_MODIFIED_DATE

  # 库存现状（呆滞库存基线）
  INV_COST_BAL:
    mode: full_refresh
  INV_COST_BAL_DETAIL:
    mode: full_refresh
  INV_SUMMARY:
    mode: full_refresh
  INV_SUMMARY_COST_DETAIL:
    mode: full_refresh
  INV_OPENING_COST:
